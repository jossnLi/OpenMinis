name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
        cache: gradle
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.25
        cache: false
    
    - name: Install gomobile
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        gomobile init
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Install NDK
      run: |
        echo "y" | sdkmanager --install "ndk;28.0.12433566"
        echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.0.12433566" >> $GITHUB_ENV
    
    - name: Install CMake
      run: |
        echo "y" | sdkmanager --install "cmake;3.22.1"
    
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ninja-build pkg-config curl tar make
    
    - name: Build PRoot
      run: |
        cd deps
        ./build_proot.sh
    
    - name: Prepare Android sandbox
      run: |
        ./scripts/prepare_android_sandbox.sh
    
    - name: Build Rclone AAR
      run: |
        ./deps/build_rclone_android.sh
        mkdir -p src/android/app/libs
        cp deps/build/rclone/rclone.aar src/android/app/libs/
    
    - name: Create provider customization
      run: |
        if [ ! -f src/android/app/provider-customization.properties ]; then
          cp src/android/app/provider-customization.properties.example src/android/app/provider-customization.properties
        fi
    
    - name: Grant execute permission for gradlew
      run: chmod +x src/android/gradlew
    
    - name: Build Release APK
      run: |
        cd src/android
        ./gradlew assembleRelease --no-daemon --stacktrace
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: openminis-release-apk
        path: src/android/app/build/outputs/apk/release/*.apk
        retention-days: 30
    
    - name: Upload Debug Symbols
      uses: actions/upload-artifact@v4
      with:
        name: openminis-debug-symbols
        path: src/android/app/build/outputs/native-debug-symbols/release/*.zip
        retention-days: 30
        if-no-files-found: ignore
